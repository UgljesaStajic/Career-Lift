
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerLift AI - Your Professional Edge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
    <style>
        :root {
          --accent: #3b82f6; /* Blue 500 */
          --accent-hover: #2563eb; /* Blue 600 */
          --bg: #ffffff;
          --card-bg: #f9fafb;
          --border: #e5e7eb;
          --text-main: #000000;
          --text-muted: #4b5563;
        }

        .dark, .theme-dark {
          --accent: #22c55e; /* Green 500 */
          --accent-hover: #16a34a; /* Green 600 */
          --bg: #000000;
          --card-bg: #111111;
          --border: #262626;
          --text-main: #ffffff;
          --text-muted: #a3a3a3;
        }

        body { 
          font-family: 'Inter', sans-serif; 
          background-color: var(--bg);
          color: var(--text-main);
          transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Semantic Classes */
        .bg-main { background-color: var(--bg); }
        .bg-card { background-color: var(--card-bg); }
        .border-main { border-color: var(--border); }
        .text-accent { color: var(--accent); }
        .bg-accent { background-color: var(--accent); }
        .hover-bg-accent:hover { background-color: var(--accent-hover); }
        .text-main { color: var(--text-main); }
        .text-muted { color: var(--text-muted); }

        /* Elevation */
        .elegant-shadow {
          box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.1);
        }
        .dark .elegant-shadow {
          box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.5);
        }

        /* Global UI Elements */
        .glass-card {
          background-color: var(--card-bg);
          border: 1px solid var(--border);
          transition: all 0.2s ease;
        }

        /* Custom scrollbar for elegance */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { 
          background: var(--border); 
          border-radius: 10px;
        }

        /* PDF Export Styling */
        #resume-template {
          font-family: 'Inter', sans-serif;
          color: #1a1a1a;
          background: white;
          width: 210mm; /* A4 width */
          padding: 20mm;
          margin: 0 auto;
        }

        .premium-gradient {
          background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        .dark .premium-gradient {
          background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
